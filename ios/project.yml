name: NOX
options:
  bundleIdPrefix: app.nox
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    SWIFT_VERSION: '5.9'
targets:
  NOX:
    type: application
    platform: iOS
    sources:
      - path: NOXApp.swift
      - path: NOXWebView.swift
      - path: NOXHealthKitSteps.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nox.mobile
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: NOX lit tes pas quotidiens avec ton autorisation pour afficher ton activité.
        INFOPLIST_KEY_NOXWebURL: ${NOX_WEB_URL}
        CODE_SIGN_ENTITLEMENTS: NOX.entitlements
    entitlements:
      path: NOX.entitlements
